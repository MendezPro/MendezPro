name: Refresh profile trophies

on:
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_stats.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh cached trophy cards
        run: python scripts/update_stats.py
      - name: Save updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trophies.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: refresh profile trophies"
          git push
